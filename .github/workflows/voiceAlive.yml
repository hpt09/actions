name: Hourly HTTP Request

on:
  schedule:
    # Runs hourly at :23. The top of the hour is GitHub's most contended
    # scheduling slot, so '0 * * * *' is where dropped/delayed runs come from.
    - cron: '23 * * * *'
  # Allows you to run this workflow manually from the Actions tab for testing
  workflow_dispatch:

jobs:
  ping_url:
    runs-on: ubuntu-latest
    steps:
      - name: Call the URL endpoint
        # --fail-with-body exits non-zero on 4xx/5xx so the run actually fails
        # (and emails), while still printing the body that names the bad venue.
        run: curl -sS --fail-with-body "https://voice-ai-api-harpreets-projects-f8b2f14c.vercel.app/api/checkBlocks"
